[project]
name = "bitnp-raspberrygirl-vtuber-sound"
version = "0.1.0"
description = "Mode-agnostic sound service scaffold for the distributed AI VTuber system."
requires-python = ">=3.12"
dependencies = [
    "sounddevice==0.5.5",
    "websockets==16.1.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "basedpyright>=1.39.9",
    "pytest>=8",
    "pytest-asyncio>=1",
    "ruff>=0.12",
]

[project.scripts]
sound-health = "sound.health:main"
sound-play = "sound.play:main"
sound-receive = "sound.receive:main"

[tool.hatch.build.targets.wheel]
packages = ["src/sound"]

[tool.pyright]
typeCheckingMode = "strict"
include = ["src"]
venvPath = "."
venv = ".venv"
stubPath = "typings"

[tool.ruff]
target-version = "py312"
line-length = 88
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = []

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
pythonpath = ["src"]
addopts = ["-ra", "--strict-config", "--strict-markers"]
filterwarnings = ["error"]
markers = [
    "real_adapter: opt-in smoke tests for live or fake-local real adapter boundaries",
]
